<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel da Carta 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&family=Caveat:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1426;--paper:#f3ead8;--paper2:#e6d8bc;--ink:#2a2433;--seal:#b3324e;--sak:#f4a9bd}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 110%,#2a3a63 0%,#16223d 35%,var(--bg) 75%) fixed;color:var(--ink);font:16px/1.55 "Zen Kaku Gothic New",system-ui,sans-serif;display:grid;place-items:start center;padding:40px 16px}
.sheet{width:min(720px,100%);background:linear-gradient(175deg,var(--paper),var(--paper2));border-radius:6px;padding:clamp(24px,5vw,44px);box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}
.kick{font:700 22px "Caveat",cursive;color:var(--seal);margin:0}
h1{font:800 clamp(30px,5vw,42px)/1.1 "Shippori Mincho",serif;margin:4px 0 6px;color:#1f1a2b}
.muted{color:#6b6078;margin:0 0 22px}
.cards{display:grid;gap:12px}
.card{display:flex;align-items:center;gap:14px;background:#fffaf0;border-radius:12px;padding:14px 16px;box-shadow:0 8px 18px -12px rgba(0,0,0,.4);border-left:6px solid var(--c)}
.card .nm{font-weight:700;font-size:18px;color:#1f1a2b;flex:1}
.card .nm small{display:block;font-weight:400;font-size:13px;color:#7a6f88}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.st.no{background:#3a3246;color:#f3ead8}
@media(max-width:560px){.card{flex-wrap:wrap}.card .tags{justify-content:flex-start;width:100%}}
.card .st{font-weight:700;padding:6px 14px;border-radius:999px;white-space:nowrap;font-size:15px}
.st.ok{background:var(--c);color:#1f1a2b}
.st.wait{background:#ece3d0;color:#7a6f88;font-weight:500}
.sum{margin:22px 0 0;font:700 26px/1.2 "Caveat",cursive;color:var(--seal)}
h2{font:800 22px "Shippori Mincho",serif;margin:28px 0 10px;color:#1f1a2b}
.versos{display:flex;flex-wrap:wrap;gap:8px}
.v{padding:8px 14px;border-radius:10px;font-weight:700;font-size:15px;background:#fffaf0;box-shadow:inset 0 0 0 2px var(--seal);color:var(--seal)}
.v.taken{box-shadow:none;background:var(--c);color:#1f1a2b}
.foot{margin-top:24px;font-size:14px;color:#7a6f88;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between}
.err{color:var(--seal);font-weight:700}
button{font:700 15px "Zen Kaku Gothic New",sans-serif;border:0;border-radius:999px;background:var(--ink);color:var(--paper);min-height:44px;padding:0 18px;cursor:pointer}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.ghost{background:transparent;color:var(--seal);box-shadow:inset 0 0 0 2px var(--seal)}
button.ghost.sure{background:var(--seal);color:#fff}
.zmsg{margin:10px 0 0;font-size:14px;color:#6b6078;min-height:1.4em}
button:focus-visible{outline:3px solid var(--sak);outline-offset:2px}
</style>
</head>
<body>
<main class="sheet">
  <p class="kick">só para o VitchBeats</p>
  <h1>Painel da Carta 10</h1>
  <p class="muted">Quem aceitou ou recusou e qual verso cada um escolheu. A página se atualiza sozinha.</p>
  <div class="cards" id="cards"></div>
  <p class="sum" id="sum"></p>
  <h2>Versos</h2>
  <div class="versos" id="versos"></div>
  <div class="foot"><span id="upd">carregando…</span><span class="btns"><button type="button" class="ghost" id="zerar">Zerar testes</button><button type="button" id="ref">Atualizar agora</button></span></div>
  <p class="zmsg" id="zmsg" role="status" aria-live="polite"></p>
</main>
<script>
{
const PESSOAS = { lucas: { nome: "Lucas ART", cor: "#f4a9bd" }, pedro: { nome: "Pedro Alvez", cor: "#9dbcf5" }, gabriel: { nome: "Gabriel Rodrigues", cor: "#f2cf7e" } };
const VERSOS = [ { id: "verso-1", nome: "Verso 1" }, { id: "verso-2", nome: "Verso 2" }, { id: "verso-3", nome: "Verso 3" }, { id: "verso-4", nome: "Verso 4" } ];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);
async function carregar() {
  try {
    const r = await fetch("/api/escolhas", { cache: "no-store" });
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro || "erro");
    const esc0 = j.escolhas || {}, resp = j.respostas || {};
    const quando = t => { if (!t) return ""; const d = new Date(t); return isNaN(d) ? "" : d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); };
    const porPessoa = {};
    for (const [v, p] of Object.entries(esc0)) if (PESSOAS[p]) porPessoa[p] = v;
    $("cards").innerHTML = Object.entries(PESSOAS).map(([k, p]) => {
      const v = VERSOS.find(x => x.id === porPessoa[k]), r = resp[k];
      let tags, det;
      if (r && r.resposta === "recusou") { tags = `<span class="st no">recusou</span>`; det = "respondeu " + quando(r.quando); }
      else if (r && r.resposta === "aceitou") { tags = `<span class="st ok">aceitou</span>` + (v ? `<span class="st ok">${esc(v.nome)}</span>` : `<span class="st wait">ainda sem verso</span>`); det = "aceitou " + quando(r.quando); }
      else { tags = `<span class="st wait">sem resposta</span>`; det = ""; }
      return `<div class="card" style="--c:${p.cor}"><span class="nm">${esc(p.nome)}${det ? `<small>${esc(det)}</small>` : ""}</span><span class="tags">${tags}</span></div>`;
    }).join("");
    const ks = Object.keys(PESSOAS);
    const ac = ks.filter(k => resp[k] && resp[k].resposta === "aceitou").length, rc = ks.filter(k => resp[k] && resp[k].resposta === "recusou").length;
    const sem = ks.length - ac - rc;
    $("sum").textContent = ac === 3 ? "Os três aceitaram!" : `${ac} ${ac === 1 ? "aceitou" : "aceitaram"} · ${rc} ${rc === 1 ? "recusou" : "recusaram"} · ${sem} sem resposta`;
    $("versos").innerHTML = VERSOS.map(v => {
      const p = PESSOAS[esc0[v.id]];
      if (v.fixo) return `<span class="v taken" style="--c:#e06a86">${esc(v.nome)} · ${esc(v.fixo)}</span>`;
      return p ? `<span class="v taken" style="--c:${p.cor}">${esc(v.nome)} · ${esc(p.nome)}</span>` : `<span class="v">${esc(v.nome)} · livre</span>`;
    }).join("");
    $("upd").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    $("upd").className = "";
  } catch (e) {
    $("upd").textContent = "Não consegui ler as escolhas. O banco da Vercel já foi ligado?";
    $("upd").className = "err";
  }
}
$("ref").addEventListener("click", carregar);
let certeza = null;
$("zerar").addEventListener("click", async () => {
  const b = $("zerar");
  if (!certeza) {
    b.classList.add("sure"); b.textContent = "Tem certeza? Toque de novo";
    $("zmsg").textContent = "Isso apaga todas as respostas e escolhas de verso. Use só para limpar os seus testes.";
    certeza = setTimeout(() => { certeza = null; b.classList.remove("sure"); b.textContent = "Zerar testes"; $("zmsg").textContent = ""; }, 5000);
    return;
  }
  clearTimeout(certeza); certeza = null; b.classList.remove("sure"); b.textContent = "Zerar testes";
  try {
    const r = await fetch("/api/escolhas", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ acao: "zerar" }) });
    if (!r.ok) throw 0;
    $("zmsg").textContent = "Pronto, tudo zerado. Pode mandar os links.";
  } catch (e) { $("zmsg").textContent = "Não consegui zerar agora. Tenta de novo."; }
  carregar();
});
carregar();
setInterval(() => { if (!document.hidden) carregar(); }, 10000);
}
</script>
</body>
</html>
